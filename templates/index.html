<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Crowd Surveillance</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            text-align: center;
        }

        h1 {
            margin: 20px 0;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-box {
            border: 3px solid #00ff00;
            padding: 6px;
            background: #000;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .footer {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <h1>Live Crowd Surveillance</h1>

    <div class="container">
        <div class="video-box">
            <!-- LIVE STREAM IMAGE -->
            <img id="liveStream" src="/stream" width="800">
        </div>
    </div>

    <div class="footer">
        AI-Based Crowd Behaviour & Surveillance System
    </div>

    <!-- 🔴 IMPORTANT: AUTO-REFRESH SCRIPT (NO CACHE) -->
    <script>
        setInterval(() => {
            const img = document.getElementById("liveStream");
            img.src = "/stream?t=" + new Date().getTime();
        }, 150); // refresh every 150 ms
    </script>

</body>
</html>
